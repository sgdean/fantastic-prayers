<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Fantastic Prayers: a working proposal to bring a CD-ROM artwork back to life through modern web browser technology.">
  <title>Fantastic Prayers | A work returning</title>
  <link rel="stylesheet" href="./site-assets/site.css">
</head>
<body class="entry-page">
  <main class="entry-shell">
    <div class="entry-image" aria-hidden="true"></div>
    <div class="entry-wash" aria-hidden="true"></div>

    <section class="entry-content" aria-labelledby="entry-title">
      <p class="eyebrow">1998 <span aria-hidden="true">↔</span> 2026</p>
      <h1 id="entry-title">Fantastic<br>Prayers</h1>
      <p class="entry-deck">An artwork returning to view.</p>
      <p class="entry-note">A working proposal for the artists and collaborators.</p>

      <div class="entry-actions">
        <button class="button button-primary" type="button" data-gated-destination="./project/">
          Read the project update <span aria-hidden="true">↗</span>
        </button>
        <button class="text-button" type="button" data-gated-destination="./world/">
          Experience <em>Walls That Speak</em>
        </button>
      </div>
    </section>

    <button class="entry-catalog" type="button" data-gated-destination="./catalog/">
      Walls asset reference
    </button>
  </main>

  <dialog class="access-dialog" id="access-dialog" aria-labelledby="access-title">
    <form method="dialog" id="access-form">
      <button class="dialog-close" value="cancel" aria-label="Close">×</button>
      <p class="eyebrow">Working site</p>
      <h2 id="access-title">Enter the shared password</h2>
      <p>This material is being assembled for conversation with the artists and collaborators.</p>
      <label for="access-password">Password</label>
      <input id="access-password" name="password" type="password" autocomplete="current-password" required>
      <p class="access-error" id="access-error" role="alert" hidden>That password didn’t work. Please try again.</p>
      <button class="button button-primary" type="submit">Enter</button>
    </form>
  </dialog>

  <script src="./site-assets/site.js"></script>
</body>
</html>
